<text x="42" y="163" font-size="26" fill="#526377" text-anchor="start" font-weight="400">INSARAG 地面層稱 Ground Floor；往上一層才是 Floor 1。</text><text x="220" y="230" font-size="28" fill="#17283b" text-anchor="middle" font-weight="700">INSARAG 樓層名稱</text><text x="681" y="230" font-size="28" fill="#17283b" text-anchor="middle" font-weight="700">一般臺灣慣用標示（僅示意）</text><rect x="65" y="257" width="365" height="69" rx="0" fill="#f7f9fc" stroke="#17283b" stroke-width="2"/><text x="247" y="303" font-size="29" fill="#17283b" text-anchor="middle" font-weight="400">Floor 3</text><text x="681" y="303" font-size="31" fill="#17283b" text-anchor="middle" font-weight="400">4F</text><rect x="65" y="326" width="365" height="69" rx="0" fill="#f7f9fc" stroke="#17283b" stroke-width="2"/><text x="247" y="372" font-size="29" fill="#17283b" text-anchor="middle" font-weight="400">Floor 2</text><text x="681" y="372" font-size="31" fill="#17283b" text-anchor="middle" font-weight="400">3F</text><rect x="65" y="395" width="365" height="69" rx="0" fill="#f7f9fc" stroke="#17283b" stroke-width="2"/><text x="247" y="441" font-size="29" fill="#17283b" text-anchor="middle" font-weight="400">Floor 1</text><text x="681" y="441" font-size="31" fill="#17283b" text-anchor="middle" font-weight="400">2F</text><rect x="65" y="464" width="365" height="69" rx="0" fill="#fff0dd" stroke="#17283b" stroke-width="2"/><text x="247" y="510" font-size="29" fill="#17283b" text-anchor="middle" font-weight="700">Ground Floor</text><text x="681" y="510" font-size="31" fill="#17283b" text-anchor="middle" font-weight="700">1F</text><rect x="65" y="533" width="365" height="69" rx="0" fill="#f7f9fc" stroke="#17283b" stroke-width="2"/><text x="247" y="579" font-size="29" fill="#17283b" text-anchor="middle" font-weight="400">Basement 1</text><text x="681" y="579" font-size="31" fill="#17283b" text-anchor="middle" font-weight="400">B1</text><rect x="65" y="602" width="365" height="69" rx="0" fill="#f7f9fc" stroke="#17283b" stroke-width="2"/><text x="247" y="648" font-size="29" fill="#17283b" text-anchor="middle" font-weight="400">Basement 2</text><text x="681" y="648" font-size="31" fill="#17283b" text-anchor="middle" font-weight="400">B2</text><line x1="36" y1="533" x2="1135" y2="533" stroke="#b84600" stroke-width="3" stroke-dasharray="12 8"/><text x="1100" y="514" font-size="24" fill="#b84600" text-anchor="end" font-weight="400">地面</text><text x="42" y="726" font-size="25" fill="#526377" text-anchor="start" font-weight="400">建物原有編號、夾層與倒塌狀況可能不同，進場前先統一樓層名稱。</text>
