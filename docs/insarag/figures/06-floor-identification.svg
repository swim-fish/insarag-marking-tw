<title id="title">樓層標記：Ground Floor 與地下層</title><desc id="desc">由上至下為 Floor 3、Floor 2、Floor 1、Ground Floor、Basement 1、Basement 2，右側是一般臺灣慣用樓層的教學對照。</desc><metadata>{&quot;source_id&quot;: &quot;S1&quot;, &quot;source_url&quot;: &quot;https://insarag.org/wp-content/uploads/2021/06/INSARAG20Guidelines20Vol20II2C20Man20B.pdf&quot;, &quot;printed_pages&quot;: [42, 43], &quot;basis&quot;: &quot;INSARAG Guidelines 2020&quot;, &quot;verified_date&quot;: &quot;2026-10-05&quot;, &quot;nature&quot;: &quot;Redrawn instructional example; not to scale&quot;}</metadata>
