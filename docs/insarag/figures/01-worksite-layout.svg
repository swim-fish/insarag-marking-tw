<text x="42" y="162" font-size="25" fill="#526377" text-anchor="start" font-weight="400">方框內記錄識別與已完成作業；框外標示危害、分流及入口方向。</text><rect x="92" y="244" width="552" height="400" rx="0" fill="white" stroke="#b84600" stroke-width="6"/><text x="368.0" y="224" font-size="22" fill="#b84600" text-anchor="middle" font-weight="700">ASBESTOS</text><text x="368.0" y="392.0" font-size="132" fill="#b84600" text-anchor="middle" font-weight="700">C-5</text><text x="110" y="480.0" font-size="25" fill="#b84600" text-anchor="start" font-weight="700">AUS-01</text><text x="329.36" y="480.0" font-size="25" fill="#b84600" text-anchor="start" font-weight="700">ASR 2</text><text x="500.48" y="480.0" font-size="25" fill="#b84600" text-anchor="start" font-weight="700">05 Oct</text><text x="368.0" y="682" font-size="28" fill="#b84600" text-anchor="middle" font-weight="700">B</text><text x="760" y="228" font-size="28" fill="#17283b" text-anchor="start" font-weight="700">危害（框上方）</text><text x="760" y="265" font-size="23" fill="#526377" text-anchor="start" font-weight="400">範例：ASBESTOS／石綿</text><text x="760" y="338" font-size="28" fill="#17283b" text-anchor="start" font-weight="700">Worksite ID（框內大字）</text><text x="760" y="375" font-size="23" fill="#526377" text-anchor="start" font-weight="400">2020 範例：C 分區、第 5 場址</text><text x="760" y="453" font-size="28" fill="#17283b" text-anchor="start" font-weight="700">Team ID ＋ 已完成 ASR ＋ 日期</text><text x="760" y="490" font-size="23" fill="#526377" text-anchor="start" font-weight="400">範例：AUS-01  /  ASR 2  /  05 Oct</text><text x="760" y="582" font-size="28" fill="#17283b" text-anchor="start" font-weight="700">分流類別（框下方）</text><text x="760" y="619" font-size="23" fill="#526377" text-anchor="start" font-weight="400">範例 B；定義請見文字文件</text><line x1="652" y1="666" x2="742" y2="666" stroke="#b84600" stroke-width="4" marker-end="url(#arrow)"/><text x="760" y="666" font-size="28" fill="#17283b" text-anchor="start" font-weight="700">入口方向（必要時）</text><text x="760" y="703" font-size="23" fill="#526377" text-anchor="start" font-weight="400">範例向右；依現場位置決定</text><text x="95" y="726" font-size="24" fill="#17283b" text-anchor="start" font-weight="400">現場參考：ID 約高 40 cm；Team ID／ASR 約高 10 cm。</text><text x="95" y="764" font-size="24" fill="#526377" text-anchor="start" font-weight="400">方框尺寸原文約 1.2–1.0 m；本圖未指定實際寬高。</text>
