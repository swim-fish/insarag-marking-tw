<title id="title">警戒標記：作業區與禁入區</title><desc id="desc">左圖兩支柱上方是一條水平紅白警戒帶；右圖兩支柱間的紅白警戒帶交叉成 X，表示禁入區。</desc><metadata>{&quot;source_id&quot;: &quot;S1&quot;, &quot;source_url&quot;: &quot;https://insarag.org/wp-content/uploads/2021/06/INSARAG20Guidelines20Vol20II2C20Man20B.pdf&quot;, &quot;printed_pages&quot;: [43], &quot;basis&quot;: &quot;INSARAG Guidelines 2020&quot;, &quot;verified_date&quot;: &quot;2026-10-05&quot;, &quot;nature&quot;: &quot;Redrawn instructional example; not to scale&quot;}</metadata>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b84600"/></marker>
<pattern id="tape" width="36" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)"><rect width="36" height="18" fill="white"/><rect width="18" height="18" fill="#be273b"/></pattern></defs>
<rect width="1200" height="790" fill="white"/>
<g font-family="Microsoft JhengHei, Noto Sans CJK TC, Arial, sans-serif">
<text x="42" y="45" font-size="17" fill="#526377" text-anchor="start" font-weight="700">INSARAG 2020  /  FIELD MARKING REFERENCE</text>
<text x="42" y="97" font-size="38" fill="#17283b" text-anchor="start" font-weight="700">警戒標記：作業區與禁入區</text>
<line x1="42" y1="122" x2="1158" y2="122" stroke="#d8e1eb" stroke-width="2" />
<text x="42" y="163" font-size="26" fill="#526377" text-anchor="start" font-weight="400">選用警戒標記；作業區以水平帶、禁入區以交叉帶示意。</text><text x="295" y="241" font-size="27" fill="#17283b" text-anchor="middle" font-weight="700">Operational Work Zone／作業區</text><line x1="100" y1="292" x2="100" y2="558" stroke="#677a8e" stroke-width="10" /><line x1="490" y1="292" x2="490" y2="558" stroke="#677a8e" stroke-width="10" /><line x1="70" y1="562" x2="523" y2="562" stroke="#17283b" stroke-width="3" /><text x="895" y="241" font-size="27" fill="#17283b" text-anchor="middle" font-weight="700">Exclusion Zone／禁入區</text><line x1="700" y1="292" x2="700" y2="558" stroke="#677a8e" stroke-width="10" /><line x1="1090" y1="292" x2="1090" y2="558" stroke="#677a8e" stroke-width="10" /><line x1="670" y1="562" x2="1123" y2="562" stroke="#17283b" stroke-width="3" /><rect x="100" y="301" width="390" height="22" rx="0" fill="url(#tape)" stroke="#9ca8b5" stroke-width="1"/><path d="M 700 306 L 1090 541 M 700 541 L 1090 306" stroke="#9ca8b5" stroke-width="26"/><path d="M 700 306 L 1090 541 M 700 541 L 1090 306" stroke="url(#tape)" stroke-width="22"/><text x="295" y="629" font-size="26" fill="#17283b" text-anchor="middle" font-weight="400">限制進入作業範圍</text><text x="895" y="629" font-size="26" fill="#17283b" text-anchor="middle" font-weight="400">隔離危險範圍、禁止進入</text><text x="42" y="705" font-size="24" fill="#526377" text-anchor="start" font-weight="400">排列依官方 Figures 15–16 重繪；實際範圍、出入口與管制方式由現場決定。</text>
<line x1="42" y1="726" x2="1158" y2="726" stroke="#d8e1eb" stroke-width="2" />
