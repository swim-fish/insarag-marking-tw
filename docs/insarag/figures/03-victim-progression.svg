<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc" lang="zh-TW">
<title id="title">受困者位置標記：V、L、D 與人數更新</title><desc id="desc">四階段示例：V；L-2 與 D-1；劃掉 L-2 後補 L-1；最後所有有效人數都劃掉，V 保留。</desc><metadata>{&quot;source_id&quot;: &quot;S1&quot;, &quot;source_url&quot;: &quot;https://insarag.org/wp-content/uploads/2021/06/INSARAG20Guidelines20Vol20II2C20Man20B.pdf&quot;, &quot;printed_pages&quot;: [48, 49], &quot;basis&quot;: &quot;INSARAG Guidelines 2020&quot;, &quot;verified_date&quot;: &quot;2026-10-05&quot;, &quot;nature&quot;: &quot;Redrawn instructional example; not to scale&quot;}</metadata>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b84600"/></marker>
<pattern id="tape" width="36" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)"><rect width="36" height="18" fill="white"/><rect width="18" height="18" fill="#be273b"/></pattern></defs>
<rect width="1200" height="810" fill="white"/>
<g font-family="Microsoft JhengHei, Noto Sans CJK TC, Arial, sans-serif">
<text x="42" y="45" font-size="17" fill="#526377" text-anchor="start" font-weight="700">INSARAG 2020  /  FIELD MARKING REFERENCE</text>
<text x="42" y="97" font-size="38" fill="#17283b" text-anchor="start" font-weight="700">受困者位置標記：V、L、D 與人數更新</text>
<line x1="42" y1="122" x2="1158" y2="122" stroke="#d8e1eb" stroke-width="2" />
<text x="42" y="163" font-size="24" fill="#526377" text-anchor="start" font-weight="400">V 指出潛在位置；L／D 人數只寫確認結果，移出後劃掉舊數字並保留更新紀錄。</text><rect x="30" y="192" width="268" height="420" rx="12" fill="#f7f9fc" stroke="#d8e1eb" stroke-width="2"/><text x="48" y="235" font-size="23" fill="#17283b" text-anchor="start" font-weight="700">1  潛在位置</text><text x="187" y="345" font-size="106" fill="#b84600" text-anchor="middle" font-weight="700">V</text><line x1="136" y1="315" x2="60" y2="350" stroke="#b84600" stroke-width="3" marker-end="url(#arrow)"/><text x="164" y="576" font-size="21" fill="#526377" text-anchor="middle" font-weight="400">尚未確認是否生還</text><rect x="323" y="192" width="268" height="420" rx="12" fill="#f7f9fc" stroke="#d8e1eb" stroke-width="2"/><text x="341" y="235" font-size="23" fill="#17283b" text-anchor="start" font-weight="700">2  確認人數</text><text x="480" y="345" font-size="106" fill="#b84600" text-anchor="middle" font-weight="700">V</text><line x1="429" y1="315" x2="353" y2="350" stroke="#b84600" stroke-width="3" marker-end="url(#arrow)"/><text x="455" y="405" font-size="32" fill="#b84600" text-anchor="middle" font-weight="700">L-2</text><text x="455" y="455" font-size="32" fill="#b84600" text-anchor="middle" font-weight="700">D-1</text><text x="457" y="576" font-size="21" fill="#526377" text-anchor="middle" font-weight="400">2 名生還者、1 名罹難者</text><rect x="616" y="192" width="268" height="420" rx="12" fill="#f7f9fc" stroke="#d8e1eb" stroke-width="2"/><text x="634" y="235" font-size="23" fill="#17283b" text-anchor="start" font-weight="700">3  移出 1 名生還者</text><text x="773" y="345" font-size="106" fill="#b84600" text-anchor="middle" font-weight="700">V</text><line x1="722" y1="315" x2="646" y2="350" stroke="#b84600" stroke-width="3" marker-end="url(#arrow)"/><text x="748" y="405" font-size="32" fill="#b84600" text-anchor="middle" font-weight="700">L-2</text><text x="748" y="455" font-size="32" fill="#b84600" text-anchor="middle" font-weight="700">D-1</text><line x1="706" y1="394" x2="791" y2="410" stroke="#b84600" stroke-width="4" /><text x="748" y="505" font-size="32" fill="#b84600" text-anchor="middle" font-weight="700">L-1</text><text x="750" y="576" font-size="21" fill="#526377" text-anchor="middle" font-weight="400">仍有 L-1 與 D-1</text><rect x="909" y="192" width="268" height="420" rx="12" fill="#f7f9fc" stroke="#d8e1eb" stroke-width="2"/><text x="927" y="235" font-size="23" fill="#17283b" text-anchor="start" font-weight="700">4  已知受困者全移出</text><text x="1066" y="345" font-size="106" fill="#b84600" text-anchor="middle" font-weight="700">V</text><line x1="1015" y1="315" x2="939" y2="350" stroke="#b84600" stroke-width="3" marker-end="url(#arrow)"/><text x="1041" y="405" font-size="32" fill="#b84600" text-anchor="middle" font-weight="700">L-2</text><text x="1041" y="455" font-size="32" fill="#b84600" text-anchor="middle" font-weight="700">D-1</text><line x1="999" y1="394" x2="1084" y2="410" stroke="#b84600" stroke-width="4" /><text x="1041" y="505" font-size="32" fill="#b84600" text-anchor="middle" font-weight="700">L-1</text><line x1="999" y1="444" x2="1084" y2="460" stroke="#b84600" stroke-width="4" /><line x1="999" y1="494" x2="1084" y2="510" stroke="#b84600" stroke-width="4" /><text x="1043" y="576" font-size="21" fill="#526377" text-anchor="middle" font-weight="400">所有有效 L／D 劃掉</text><text x="42" y="675" font-size="24" fill="#17283b" text-anchor="start" font-weight="400">標在接近實際受困者位置的表面，約 50 cm；不要一律集中畫在建物正面。</text><text x="42" y="719" font-size="24" fill="#526377" text-anchor="start" font-weight="400">全部已知受困者移出，不表示整棟建物已完成全面搜尋。</text>
<line x1="42" y1="746" x2="1158" y2="746" stroke="#d8e1eb" stroke-width="2" />
