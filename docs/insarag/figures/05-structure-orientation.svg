<text x="42" y="163" font-size="25" fill="#526377" text-anchor="start" font-weight="400">平面俯視圖：正面朝下；面向 1–4 與象限 A–D 都依順時針排列。</text><rect x="242" y="242" width="490" height="340" rx="0" fill="#f7f9fc" stroke="#17283b" stroke-width="4"/><line x1="487" y1="242" x2="487" y2="582" stroke="#9dadbf" stroke-width="3" /><line x1="242" y1="412" x2="732" y2="412" stroke="#9dadbf" stroke-width="3" /><text x="357" y="337" font-size="68" fill="#b84600" text-anchor="middle" font-weight="700">B</text><text x="612" y="337" font-size="68" fill="#b84600" text-anchor="middle" font-weight="700">C</text><text x="357" y="512" font-size="68" fill="#b84600" text-anchor="middle" font-weight="700">A</text><text x="612" y="512" font-size="68" fill="#b84600" text-anchor="middle" font-weight="700">D</text><rect x="407" y="372" width="160" height="80" rx="10" fill="#fff0dd" stroke="#b84600" stroke-width="3"/><text x="487" y="427" font-size="51" fill="#b84600" text-anchor="middle" font-weight="700">E</text><text x="487" y="218" font-size="26" fill="#17283b" text-anchor="middle" font-weight="700">Side 3／背面</text><text x="487" y="627" font-size="26" fill="#17283b" text-anchor="middle" font-weight="700">Side 1／正面</text><text x="155" y="420" font-size="26" fill="#17283b" text-anchor="middle" font-weight="700">Side 2</text><text x="817" y="420" font-size="26" fill="#17283b" text-anchor="middle" font-weight="700">Side 4</text><rect x="240" y="652" width="495" height="64" rx="4" fill="#eaf0f6" stroke="#d8e1eb" stroke-width="2"/><text x="487" y="694" font-size="25" fill="#17283b" text-anchor="middle" font-weight="400">街道／門牌側</text><text x="920" y="280" font-size="28" fill="#17283b" text-anchor="start" font-weight="700">A 起點</text><text x="920" y="317" font-size="23" fill="#526377" text-anchor="start" font-weight="400">Side 1 與 2 交角</text><text x="920" y="382" font-size="28" fill="#17283b" text-anchor="start" font-weight="700">A → B → C → D</text><text x="920" y="419" font-size="23" fill="#526377" text-anchor="start" font-weight="400">順時針辨識</text><text x="920" y="486" font-size="28" fill="#17283b" text-anchor="start" font-weight="700">中央 E</text><text x="920" y="523" font-size="23" fill="#526377" text-anchor="start" font-weight="400">大廳／電梯／樓梯</text><text x="42" y="767" font-size="24" fill="#526377" text-anchor="start" font-weight="400">方向隨建物門牌側決定；本圖不表示北、南、東、西。E 的範圍需現場確認。</text>
