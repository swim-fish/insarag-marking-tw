<title id="title">快速清查標記：菱形 C／D</title><desc id="desc">菱形 C 表示全面搜尋完成且無受困者留在原位；菱形 D 表示僅有死亡受困者。死亡受困者全部移出後在旁新增 C。</desc><metadata>{&quot;source_id&quot;: &quot;S1&quot;, &quot;source_url&quot;: &quot;https://insarag.org/wp-content/uploads/2021/06/INSARAG20Guidelines20Vol20II2C20Man20B.pdf&quot;, &quot;printed_pages&quot;: [50, 51], &quot;basis&quot;: &quot;INSARAG Guidelines 2020&quot;, &quot;verified_date&quot;: &quot;2026-10-05&quot;, &quot;nature&quot;: &quot;Redrawn instructional example; not to scale&quot;}</metadata>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b84600"/></marker>
<pattern id="tape" width="36" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)"><rect width="36" height="18" fill="white"/><rect width="18" height="18" fill="#be273b"/></pattern></defs>
<rect width="1200" height="780" fill="white"/>
<g font-family="Microsoft JhengHei, Noto Sans CJK TC, Arial, sans-serif">
<text x="42" y="45" font-size="17" fill="#526377" text-anchor="start" font-weight="700">INSARAG 2020  /  FIELD MARKING REFERENCE</text>
<text x="42" y="97" font-size="38" fill="#17283b" text-anchor="start" font-weight="700">快速清查標記：菱形 C／D</text>
<line x1="42" y1="122" x2="1158" y2="122" stroke="#d8e1eb" stroke-width="2" />
<text x="42" y="163" font-size="24" fill="#526377" text-anchor="start" font-weight="400">須由 LEMA 決定啟用；C 與 D 皆代表達到等同 ASR 5 的全面搜尋標準。</text><rect x="30" y="192" width="360" height="395" rx="12" fill="#f7f9fc" stroke="#d8e1eb" stroke-width="2"/><text x="210" y="239" font-size="26" fill="#17283b" text-anchor="middle" font-weight="700">C  /  Clear</text><rect x="420" y="192" width="360" height="395" rx="12" fill="#f7f9fc" stroke="#d8e1eb" stroke-width="2"/><text x="600" y="239" font-size="26" fill="#17283b" text-anchor="middle" font-weight="700">D  /  Deceased Only</text><rect x="810" y="192" width="360" height="395" rx="12" fill="#f7f9fc" stroke="#d8e1eb" stroke-width="2"/><text x="990" y="239" font-size="26" fill="#17283b" text-anchor="middle" font-weight="700">D → 新增相鄰 C</text><path d="M 210 275 L 294 359 L 210 443 L 126 359 Z" fill="white" stroke="#b84600" stroke-width="8"/><text x="210" y="384.16" font-size="74" fill="#b84600" text-anchor="middle" font-weight="700">C</text><text x="210" y="487" font-size="25" fill="#b84600" text-anchor="middle" font-weight="700">AUS-01</text><text x="210" y="523" font-size="25" fill="#b84600" text-anchor="middle" font-weight="700">05 Oct</text><path d="M 600 275 L 684 359 L 600 443 L 516 359 Z" fill="white" stroke="#b84600" stroke-width="8"/><text x="600" y="384.16" font-size="74" fill="#b84600" text-anchor="middle" font-weight="700">D</text><text x="600" y="487" font-size="25" fill="#b84600" text-anchor="middle" font-weight="700">SGP-01</text><text x="600" y="523" font-size="25" fill="#b84600" text-anchor="middle" font-weight="700">05 Oct</text><path d="M 902 297 L 964 359 L 902 421 L 840 359 Z" fill="white" stroke="#b84600" stroke-width="8"/><text x="902" y="378.04" font-size="56" fill="#b84600" text-anchor="middle" font-weight="700">D</text><text x="902" y="465" font-size="25" fill="#b84600" text-anchor="middle" font-weight="700">SGP-01</text><text x="902" y="501" font-size="25" fill="#b84600" text-anchor="middle" font-weight="700">05 Oct</text><path d="M 1072 297 L 1134 359 L 1072 421 L 1010 359 Z" fill="white" stroke="#b84600" stroke-width="8"/><text x="1072" y="378.04" font-size="56" fill="#b84600" text-anchor="middle" font-weight="700">C</text><text x="1072" y="465" font-size="25" fill="#b84600" text-anchor="middle" font-weight="700">SGP-01</text><text x="1072" y="501" font-size="25" fill="#b84600" text-anchor="middle" font-weight="700">06 Oct</text><text x="210" y="553" font-size="21" fill="#17283b" text-anchor="middle" font-weight="400">無存活或死亡受困者留在原位</text><text x="600" y="553" font-size="21" fill="#17283b" text-anchor="middle" font-weight="400">僅有死亡受困者留在原位</text><text x="990" y="553" font-size="21" fill="#17283b" text-anchor="middle" font-weight="400">死亡受困者全數移出後更新</text><text x="42" y="642" font-size="24" fill="#17283b" text-anchor="start" font-weight="400">菱形約 20 × 20 cm；下方寫隊伍與搜尋日期。保留原 D，在旁新增 C。</text><text x="42" y="685" font-size="24" fill="#526377" text-anchor="start" font-weight="400">標記只涵蓋該物件或已界定範圍；Clear 不是建物安全認證。</text>
