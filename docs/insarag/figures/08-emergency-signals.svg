<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc" lang="zh-TW">
<title id="title">緊急號音：撤離、停止與恢復作業</title><desc id="desc">三行號音圖：撤離三短聲並重複；停止作業一長聲；恢復作業一長聲加一短聲。來源中撤離號音有矛盾，請見版本核對。</desc><metadata>{&quot;source_id&quot;: &quot;S1&quot;, &quot;source_url&quot;: &quot;https://insarag.org/wp-content/uploads/2021/06/INSARAG20Guidelines20Vol20II2C20Man20B.pdf&quot;, &quot;printed_pages&quot;: [52], &quot;basis&quot;: &quot;INSARAG Guidelines 2020&quot;, &quot;verified_date&quot;: &quot;2026-10-05&quot;, &quot;nature&quot;: &quot;Redrawn instructional example; not to scale&quot;}</metadata>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b84600"/></marker>
<pattern id="tape" width="36" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)"><rect width="36" height="18" fill="white"/><rect width="18" height="18" fill="#be273b"/></pattern></defs>
<rect width="1200" height="810" fill="white"/>
<g font-family="Microsoft JhengHei, Noto Sans CJK TC, Arial, sans-serif">
<text x="42" y="45" font-size="17" fill="#526377" text-anchor="start" font-weight="700">INSARAG 2020  /  FIELD MARKING REFERENCE</text>
<text x="42" y="97" font-size="38" fill="#17283b" text-anchor="start" font-weight="700">緊急號音：撤離、停止與恢復作業</text>
<line x1="42" y1="122" x2="1158" y2="122" stroke="#d8e1eb" stroke-width="2" />
<text x="42" y="162" font-size="25" fill="#526377" text-anchor="start" font-weight="400">採 2020 作業手冊的專門號音章節；正式演習前須向所有隊伍統一公告。</text><text x="55" y="238" font-size="29" fill="#17283b" text-anchor="start" font-weight="700">Evacuate／撤離</text><text x="55" y="281" font-size="23" fill="#526377" text-anchor="start" font-weight="400">3 短聲，每聲約 1 秒；重複至場址清空</text><rect x="680" y="211" width="62" height="40" rx="5" fill="#b84600" stroke="#b84600" stroke-width="2"/><rect x="779" y="211" width="62" height="40" rx="5" fill="#b84600" stroke="#b84600" stroke-width="2"/><rect x="878" y="211" width="62" height="40" rx="5" fill="#b84600" stroke="#b84600" stroke-width="2"/><text x="55" y="393" font-size="29" fill="#17283b" text-anchor="start" font-weight="700">Cease Operations – Quiet</text><text x="55" y="436" font-size="23" fill="#526377" text-anchor="start" font-weight="400">1 長聲，約 3 秒；停止作業、保持安靜</text><rect x="680" y="366" width="245" height="40" rx="5" fill="#b84600" stroke="#b84600" stroke-width="2"/><text x="55" y="548" font-size="29" fill="#17283b" text-anchor="start" font-weight="700">Resume Operations／恢復作業</text><text x="55" y="591" font-size="23" fill="#526377" text-anchor="start" font-weight="400">1 長聲＋1 短聲；未另訂秒數與間隔</text><rect x="680" y="521" width="205" height="40" rx="5" fill="#b84600" stroke="#b84600" stroke-width="2"/><rect x="930" y="521" width="62" height="40" rx="5" fill="#b84600" stroke="#b84600" stroke-width="2"/><text x="42" y="670" font-size="24" fill="#526377" text-anchor="start" font-weight="400">原文矛盾：Volume III p.22 檢核表寫三長聲；本圖依 S1 p.52 與 S2 號音小節。</text><text x="42" y="709" font-size="24" fill="#526377" text-anchor="start" font-weight="400">圖中長度僅示意長／短，不是聲間間隔或完整時間刻度。</text>
<line x1="42" y1="746" x2="1158" y2="746" stroke="#d8e1eb" stroke-width="2" />
<a href="https://insarag.org/wp-content/uploads/2021/06/INSARAG20Guidelines20Vol20II2C20Man20B.pdf#page=53"><text x="42" y="780" font-size="17" fill="#526377" text-anchor="start" font-weight="400">來源：S1 · 印刷頁 52 · 官方圖例重繪／教學情境</text></a>
<text x="1158" y="780" font-size="17" fill="#526377" text-anchor="end" font-weight="400">非實際比例 · 2026-10-05</text>
</g></svg>