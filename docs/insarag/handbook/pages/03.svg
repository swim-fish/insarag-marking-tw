<title id="title">INSARAG A5 圖解手冊，第 3 頁</title>
<desc>依 INSARAG 2020 原件重新繪製。中文採用 STE 原則；不是官方中文版。</desc>
<metadata>{"version": "INSARAG 2020", "verified_on": "2026-10-05", "illustrative_examples": true, "sources": {"S1": "https://insarag.org/wp-content/uploads/2021/06/INSARAG20Guidelines20Vol20II2C20Man20B.pdf", "S3": "https://insarag.org/wp-content/uploads/2021/06/INSARAG20Guidelines20Vol20III.pdf", "S4": "https://insarag.org/methodology/insarag-guidelines/", "STE": "https://www.asd-ste100.org/assets/files/ASD-STE100_ISSUE9.pdf"}}</metadata>
<rect x="0" y="0" width="419.53" height="595.28" fill="#ffffff" stroke="none" stroke-width="1"/>
<rect x="25" y="26" width="28" height="5" fill="#b94612" stroke="none" stroke-width="1"/>
<text x="395" y="32" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="10" font-weight="400" fill="#52636b" text-anchor="end">03 / 12</text>
<text x="25" y="64" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="700" fill="#183343" text-anchor="start">工作場址：更新與結案</text>
<text x="25" y="91" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="10.5" font-weight="400" fill="#183343" text-anchor="start">完成一次作業後，追加紀錄。</text>
<text x="109" y="125" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="700" fill="#183343" text-anchor="middle">追加紀錄</text>
<text x="109" y="151" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="400" fill="#b94612" text-anchor="middle">危害：瓦斯洩漏</text>
<rect x="25" y="162" width="168" height="133" fill="#fff4e9" stroke="#b94612" stroke-width="2"/>
<text x="109" y="201" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="31" font-weight="700" fill="#b94612" text-anchor="middle">C-5</text>
<text x="109" y="240" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="400" fill="#b94612" text-anchor="middle">AAA-01  ASR 3  05 Oct</text>
<text x="109" y="272" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="400" fill="#b94612" text-anchor="middle">BBB-01  ASR 4  06 Oct</text>
<text x="109" y="315" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="17" font-weight="700" fill="#b94612" text-anchor="middle">B</text>
<text x="310" y="125" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="700" fill="#183343" text-anchor="middle">必要工作全部完成</text>
<text x="310" y="151" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="400" fill="#b94612" text-anchor="middle">危害：瓦斯洩漏</text>
<rect x="226" y="162" width="168" height="133" fill="#fff4e9" stroke="#b94612" stroke-width="2"/>
<text x="310" y="201" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="31" font-weight="700" fill="#b94612" text-anchor="middle">C-5</text>
<text x="310" y="240" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="400" fill="#b94612" text-anchor="middle">AAA-01  ASR 3  05 Oct</text>
<text x="310" y="272" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="400" fill="#b94612" text-anchor="middle">BBB-01  ASR 4  06 Oct</text>
<text x="310" y="315" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="17" font-weight="700" fill="#b94612" text-anchor="middle">B</text>
<line x1="218" y1="215" x2="403" y2="215" stroke="#b94612" stroke-width="3"/>
<text x="25" y="356" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="700" fill="#b94612" text-anchor="start">1.</text>
<text x="44" y="356" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="400" fill="#183343" text-anchor="start">追加隊伍編號、已完成的 ASR 等級及日期。</text>
<text x="25" y="379" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="700" fill="#b94612" text-anchor="start">2.</text>
<text x="44" y="379" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="400" fill="#183343" text-anchor="start">保留先前的作業紀錄。</text>
<text x="25" y="402" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="700" fill="#b94612" text-anchor="start">3.</text>
<text x="44" y="402" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="400" fill="#183343" text-anchor="start">所有必要工作完成，且確認不需再作業時，畫完成線。</text>
<line x1="25" y1="418" x2="395" y2="418" stroke="#ccd6db" stroke-width="0.7"/>
<text x="25" y="428" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="9.5" font-weight="400" fill="#52636b" text-anchor="start">完成線穿過標記中央，橫越整個標記。</text>
<text x="25" y="444" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="9.5" font-weight="400" fill="#52636b" text-anchor="start">ASR 3 或 ASR 4 完成，不能單獨作為結案依據。</text>
<text x="25" y="460" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="9.5" font-weight="400" fill="#52636b" text-anchor="start">完成線不代表危害消失，也不代表結構安全。</text>
</svg>
