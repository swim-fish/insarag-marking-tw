<svg xmlns="http://www.w3.org/2000/svg" width="148mm" height="210mm" viewBox="0 0 419.53 595.28" role="img" aria-labelledby="title">
<title id="title">INSARAG A5 圖解手冊，第 7 頁</title>
<desc>依 INSARAG 2020 原件重新繪製。中文採用 STE 原則；不是官方中文版。</desc>
<metadata>{"version": "INSARAG 2020", "verified_on": "2026-10-05", "illustrative_examples": true, "sources": {"S1": "https://insarag.org/wp-content/uploads/2021/06/INSARAG20Guidelines20Vol20II2C20Man20B.pdf", "S3": "https://insarag.org/wp-content/uploads/2021/06/INSARAG20Guidelines20Vol20III.pdf", "S4": "https://insarag.org/methodology/insarag-guidelines/", "STE": "https://www.asd-ste100.org/assets/files/ASD-STE100_ISSUE9.pdf"}}</metadata>
<rect x="0" y="0" width="419.53" height="595.28" fill="#ffffff" stroke="none" stroke-width="1"/>
<rect x="25" y="26" width="28" height="5" fill="#b94612" stroke="none" stroke-width="1"/>
<text x="395" y="32" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="10" font-weight="400" fill="#52636b" text-anchor="end">07 / 12</text>
<text x="25" y="64" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="700" fill="#183343" text-anchor="start">先統一建物面向</text>
<text x="25" y="91" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="10.5" font-weight="400" fill="#183343" text-anchor="start">以街道地址所在的正面為第 1 面。</text>
<rect x="108" y="139" width="204" height="160" fill="#fff4e9" stroke="#b94612" stroke-width="2"/>
<line x1="210" y1="139" x2="210" y2="299" stroke="#b94612" stroke-width="1"/>
<line x1="108" y1="219" x2="312" y2="219" stroke="#b94612" stroke-width="1"/>
<text x="160" y="192" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="28" font-weight="700" fill="#b94612" text-anchor="middle">B</text>
<text x="262" y="192" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="28" font-weight="700" fill="#b94612" text-anchor="middle">C</text>
<text x="160" y="274" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="28" font-weight="700" fill="#b94612" text-anchor="middle">A</text>
<text x="262" y="274" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="28" font-weight="700" fill="#b94612" text-anchor="middle">D</text>
<rect x="185" y="195" width="50" height="48" fill="#ffffff" stroke="#b94612" stroke-width="2"/>
<text x="210" y="232" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="25" font-weight="700" fill="#b94612" text-anchor="middle">E</text>
<text x="210" y="127" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="12" font-weight="700" fill="#183343" text-anchor="middle">第 3 面</text>
<text x="58" y="225" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="12" font-weight="700" fill="#183343" text-anchor="middle">第 2 面</text>
<text x="363" y="225" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="12" font-weight="700" fill="#183343" text-anchor="middle">第 4 面</text>
<text x="210" y="324" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="12" font-weight="700" fill="#183343" text-anchor="middle">第 1 面／街道正面</text>
<text x="25" y="356" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="700" fill="#b94612" text-anchor="start">1.</text>
<text x="44" y="356" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="400" fill="#183343" text-anchor="start">從第 1 面開始，依順時針標示第 2、3、4 面。</text>
<text x="25" y="379" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="700" fill="#b94612" text-anchor="start">2.</text>
<text x="44" y="379" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="400" fill="#183343" text-anchor="start">依圖例標示 A、B、C、D 象限。</text>
<text x="25" y="402" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="700" fill="#b94612" text-anchor="start">3.</text>
<text x="44" y="402" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="400" fill="#183343" text-anchor="start">多樓層建物的中央區域使用 E。</text>
<text x="25" y="425" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="700" fill="#b94612" text-anchor="start">4.</text>
<text x="44" y="425" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="400" fill="#183343" text-anchor="start">通報位置前，先確認全隊使用相同的面向。</text>
<line x1="25" y1="441" x2="395" y2="441" stroke="#ccd6db" stroke-width="0.7"/>
<text x="25" y="451" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="9.5" font-weight="400" fill="#52636b" text-anchor="start">E 可表示中央樓梯、電梯或大廳區域。</text>
<text x="25" y="467" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="9.5" font-weight="400" fill="#52636b" text-anchor="start">面向與樓層標記屬選用項目。</text>
</svg>
