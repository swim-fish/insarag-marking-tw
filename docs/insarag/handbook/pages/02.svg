<text x="333" y="265" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="9.5" font-weight="700" fill="#52636b" text-anchor="start">後畫方框</text>
<line x1="331" y1="261" x2="326" y2="261" stroke="#52636b" stroke-width="0.8"/>
<text x="25" y="306" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="700" fill="#b94612" text-anchor="start">1.</text>
<text x="44" y="306" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="400" fill="#183343" text-anchor="start">先寫工作場址編號。</text>
<text x="25" y="329" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="700" fill="#b94612" text-anchor="start">2.</text>
<text x="44" y="329" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="400" fill="#183343" text-anchor="start">在編號下方同一列，記錄隊伍編號、已完成的 ASR 等級及日期。</text>
<text x="25" y="352" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="700" fill="#b94612" text-anchor="start">3.</text>
<text x="44" y="352" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="400" fill="#183343" text-anchor="start">文字完成後，畫方框圍住文字與下方的預留空白。</text>
<text x="25" y="375" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="700" fill="#b94612" text-anchor="start">4.</text>
<text x="44" y="375" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="400" fill="#183343" text-anchor="start">在方框上方記錄危害。</text>
<text x="25" y="398" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="700" fill="#b94612" text-anchor="start">5.</text>
<text x="44" y="398" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="400" fill="#183343" text-anchor="start">在方框下方記錄分流類別。</text>
<text x="25" y="421" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="700" fill="#b94612" text-anchor="start">6.</text>
<text x="44" y="421" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="400" fill="#183343" text-anchor="start">需要指出入口或位置時，加上方向箭頭。</text>
<text x="25" y="444" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="700" fill="#b94612" text-anchor="start">7.</text>
<text x="44" y="444" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="400" fill="#183343" text-anchor="start">使用與背景對比清楚的材料。</text>
<rect x="25" y="460" width="370" height="38" fill="#fff7d6" stroke="none" stroke-width="0"/>
<rect x="25" y="460" width="3" height="38" fill="#f2b705" stroke="none" stroke-width="0"/>
<text x="76" y="473" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="9.5" font-weight="400" fill="#183343" text-anchor="start">後續 ASR 等級可能由其他隊伍接手；每完成一級追加一列，換班不追加。</text>
<text x="76" y="487" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="9.5" font-weight="400" fill="#183343" text-anchor="start">畫方框時，為尚未完成的 ASR 等級預留空白列；此為演習提醒。</text>
<polygon points="48,464.0 56.5,478.79 39.5,478.79" fill="#f2b705" stroke="#183343" stroke-width="1.2"/>
<polygon points="46.674,469.3244 49.326,469.3244 48.884,474.6488 47.116,474.6488" fill="#183343" stroke="none" stroke-width="1"/>
<rect x="46.895" y="475.5362" width="2.21" height="2.21" fill="#183343" stroke="none" stroke-width="1"/>
<text x="48" y="492.0" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="9" font-weight="700" fill="#183343" text-anchor="middle">注意</text>
<line x1="25" y1="506" x2="395" y2="506" stroke="#ccd6db" stroke-width="0.7"/>
<text x="25" y="516" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="9.5" font-weight="400" fill="#52636b" text-anchor="start">場址編號每字高約 40 cm；隊伍編號與 ASR 等級每字高約 10 cm。</text>
<rect x="21" y="522.975" width="376" height="12.350000000000023" fill="#e3f1f8" stroke="none" stroke-width="0"/>
<rect x="19" y="522.975" width="2.5" height="12.350000000000023" fill="#0b6e99" stroke="none" stroke-width="0"/>
<text x="25" y="532" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="9.5" font-weight="400" fill="#52636b" text-anchor="start">場址編號＝建立場址的隊伍編號＋4 位數；分區代碼由 ICMS 附加，不寫在標記上。</text>
<text x="25" y="548" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="9.5" font-weight="400" fill="#52636b" text-anchor="start">原指引方框約 1.2 至 1.0 公尺；編號較長時，依實際文字寬度畫框。</text>
