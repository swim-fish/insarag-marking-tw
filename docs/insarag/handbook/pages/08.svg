<text x="234" y="167" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="16" font-weight="400" fill="#183343" text-anchor="start">→</text>
<text x="323" y="167" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="17" font-weight="700" fill="#183343" text-anchor="middle">3F</text>
<rect x="26" y="187" width="367" height="41" fill="#f0f4f6" stroke="none" stroke-width="1"/>
<text x="45" y="214" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="15" font-weight="400" fill="#183343" text-anchor="start">Floor 1</text>
<text x="234" y="214" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="16" font-weight="400" fill="#183343" text-anchor="start">→</text>
<text x="323" y="214" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="17" font-weight="700" fill="#183343" text-anchor="middle">2F</text>
<rect x="26" y="234" width="367" height="41" fill="#fff4e9" stroke="none" stroke-width="1"/>
<text x="45" y="261" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="15" font-weight="700" fill="#b94612" text-anchor="start">Ground Floor</text>
<text x="234" y="261" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="16" font-weight="400" fill="#183343" text-anchor="start">→</text>
<text x="323" y="261" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="17" font-weight="700" fill="#183343" text-anchor="middle">1F</text>
<rect x="26" y="281" width="367" height="41" fill="#f0f4f6" stroke="none" stroke-width="1"/>
<text x="45" y="308" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="15" font-weight="400" fill="#183343" text-anchor="start">Basement 1</text>
<text x="234" y="308" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="16" font-weight="400" fill="#183343" text-anchor="start">→</text>
<text x="323" y="308" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="17" font-weight="700" fill="#183343" text-anchor="middle">B1</text>
<text x="25" y="356" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="700" fill="#b94612" text-anchor="start">1.</text>
<text x="44" y="356" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="400" fill="#183343" text-anchor="start">通報前，核對現場樓層標示。</text>
<text x="25" y="379" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="700" fill="#b94612" text-anchor="start">2.</text>
<text x="44" y="379" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="400" fill="#183343" text-anchor="start">跨隊通報時，同時說明採用的樓層命名。</text>
<line x1="25" y1="395" x2="395" y2="395" stroke="#ccd6db" stroke-width="0.7"/>
<text x="25" y="405" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="9.5" font-weight="400" fill="#52636b" text-anchor="start">不要直接將 Floor 1 當成臺灣常見的 1F。</text>
