<text x="395" y="32" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="10" font-weight="400" fill="#52636b" text-anchor="end">08 / 12</text>
<text x="25" y="64" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="700" fill="#183343" text-anchor="start">樓層：先核對命名</text>
<text x="25" y="91" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="10.5" font-weight="400" fill="#183343" text-anchor="start">Ground Floor 與臺灣常見的 1F 對應。</text>
<text x="80" y="124" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="700" fill="#183343" text-anchor="start">INSARAG</text>
<text x="272" y="124" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="13" font-weight="700" fill="#183343" text-anchor="start">臺灣常見標示</text>
<rect x="26" y="140" width="367" height="41" fill="#f0f4f6" stroke="none" stroke-width="1"/>
