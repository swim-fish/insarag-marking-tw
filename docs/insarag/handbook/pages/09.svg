<text x="110" y="316" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="15" font-weight="700" fill="#183343" text-anchor="middle">作業工作區</text>
<text x="310" y="316" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="15" font-weight="700" fill="#183343" text-anchor="middle">禁止進入區</text>
<text x="25" y="356" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="700" fill="#b94612" text-anchor="start">1.</text>
<text x="44" y="356" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="400" fill="#183343" text-anchor="start">辨識水平紅白警戒帶表示的作業工作區。</text>
<text x="25" y="379" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="700" fill="#b94612" text-anchor="start">2.</text>
<text x="44" y="379" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="400" fill="#183343" text-anchor="start">辨識交叉紅白警戒帶表示的禁止進入區。</text>
<line x1="25" y1="395" x2="395" y2="395" stroke="#ccd6db" stroke-width="0.7"/>
<text x="25" y="405" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="9.5" font-weight="400" fill="#52636b" text-anchor="start">交叉警戒帶是區域管制，不是 FEMA 搜索標記。</text>
