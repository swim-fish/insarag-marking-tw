<svg xmlns="http://www.w3.org/2000/svg" width="148mm" height="210mm" viewBox="0 0 419.53 595.28" role="img" aria-labelledby="title">
<title id="title">INSARAG A5 圖解手冊，第 10 頁</title>
<desc>依 INSARAG 2020 原件重新繪製。中文採用 STE 原則；不是官方中文版。</desc>
<metadata>{"version": "INSARAG 2020", "verified_on": "2026-10-05", "illustrative_examples": true, "sources": {"S1": "https://insarag.org/wp-content/uploads/2021/06/INSARAG20Guidelines20Vol20II2C20Man20B.pdf", "S3": "https://insarag.org/wp-content/uploads/2021/06/INSARAG20Guidelines20Vol20III.pdf", "S4": "https://insarag.org/methodology/insarag-guidelines/", "STE": "https://www.asd-ste100.org/assets/files/ASD-STE100_ISSUE9.pdf"}}</metadata>
<rect x="0" y="0" width="419.53" height="595.28" fill="#ffffff" stroke="none" stroke-width="1"/>
<rect x="25" y="26" width="28" height="5" fill="#b94612" stroke="none" stroke-width="1"/>
<text x="395" y="32" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="10" font-weight="400" fill="#52636b" text-anchor="end">10 / 12</text>
<text x="25" y="64" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="700" fill="#183343" text-anchor="start">號音：先聽懂，再作業</text>
<text x="25" y="91" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="10.5" font-weight="400" fill="#183343" text-anchor="start">作業前，向所有隊伍說明採用的號音。</text>
<text x="26" y="130" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="15" font-weight="700" fill="#183343" text-anchor="start">撤離</text>
<text x="26" y="151" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11.5" font-weight="400" fill="#183343" text-anchor="start">3 短音；每音約 1 秒；重複</text>
<rect x="180" y="116" width="33" height="17" fill="#b94612" stroke="none" stroke-width="1"/>
<rect x="235" y="116" width="33" height="17" fill="#b94612" stroke="none" stroke-width="1"/>
<rect x="290" y="116" width="33" height="17" fill="#b94612" stroke="none" stroke-width="1"/>
<line x1="26" y1="168" x2="393" y2="168" stroke="#ccd6db" stroke-width="0.7"/>
<text x="26" y="200" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="15" font-weight="700" fill="#183343" text-anchor="start">停止作業</text>
<text x="26" y="221" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11.5" font-weight="400" fill="#183343" text-anchor="start">1 長音；約 3 秒；保持安靜</text>
<rect x="180" y="186" width="144" height="17" fill="#b94612" stroke="none" stroke-width="1"/>
<line x1="26" y1="238" x2="393" y2="238" stroke="#ccd6db" stroke-width="0.7"/>
<text x="26" y="270" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="15" font-weight="700" fill="#183343" text-anchor="start">恢復作業</text>
<text x="26" y="291" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11.5" font-weight="400" fill="#183343" text-anchor="start">1 長音 + 1 短音</text>
<rect x="180" y="256" width="105" height="17" fill="#b94612" stroke="none" stroke-width="1"/>
<rect x="310" y="256" width="33" height="17" fill="#b94612" stroke="none" stroke-width="1"/>
<text x="393" y="326" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="10" font-weight="400" fill="#52636b" text-anchor="end">橫條只表示長短，非時間比例。</text>
<text x="25" y="356" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="700" fill="#b94612" text-anchor="start">1.</text>
<text x="44" y="356" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="400" fill="#183343" text-anchor="start">聽到撤離號音時，依現場撤離流程撤離。</text>
<text x="25" y="379" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="700" fill="#b94612" text-anchor="start">2.</text>
<text x="44" y="379" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="400" fill="#183343" text-anchor="start">聽到停止號音時，停止作業。</text>
<text x="25" y="402" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="700" fill="#b94612" text-anchor="start">3.</text>
<text x="44" y="402" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="400" fill="#183343" text-anchor="start">保持安靜。</text>
<text x="25" y="425" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="700" fill="#b94612" text-anchor="start">4.</text>
<text x="44" y="425" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="11" font-weight="400" fill="#183343" text-anchor="start">聽到恢復號音時，依現場指示恢復作業。</text>
<line x1="25" y1="441" x2="395" y2="441" stroke="#ccd6db" stroke-width="0.7"/>
<text x="25" y="451" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="9.5" font-weight="400" fill="#52636b" text-anchor="start">撤離號音持續重複，直到撤離完成。</text>
<text x="25" y="467" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="9.5" font-weight="400" fill="#52636b" text-anchor="start">部分原件寫為 3 長音；現場簡報須統一撤離號音。</text>
</svg>
